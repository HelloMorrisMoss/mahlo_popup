<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Help Article Editor</title>
    <style>
        :root {
            --bg-color: #f3f3f3;
            --border-color: #ccc;
            --sidebar-width: 300px;
            --header-bg: #e1e1e1;
        }

        body {
            display: flex;
            height: 100vh;
            margin: 0;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            font-size: 14px;
        }

        h2 {
            font-size: 16px;
            margin-top: 0;
        }

        #nav-pane {
            width: var(--sidebar-width);
            border-right: 1px solid var(--border-color);
            display: flex;
            flex-direction: column;
            background: var(--bg-color);
        }

        #nav-header {
            padding: 10px;
            background: var(--header-bg);
            border-bottom: 1px solid var(--border-color);
        }

        #article-list {
            flex: 1;
            overflow-y: auto;
            padding: 10px;
        }

        .article-item {
            padding: 5px;
            cursor: pointer;
            border-radius: 3px;
            display: flex;
            align-items: center;
        }

        .article-item:hover {
            background: #ddd;
        }

        .article-item.selected {
            background: #0078d4;
            color: white;
        }

        .article-icon {
            margin-right: 5px;
            width: 16px;
            text-align: center;
        }

        .section-header {
            font-weight: bold;
            margin-top: 10px;
            margin-bottom: 5px;
            color: #666;
            font-size: 12px;
            text-transform: uppercase;
            cursor: pointer;
            display: flex;
            align-items: center;
        }

        .section-header:hover {
            color: #333;
        }

        .folder-content {
            margin-left: 15px;
        }

        .folder-item {
            padding: 5px;
            cursor: pointer;
            border-radius: 3px;
            display: flex;
            align-items: center;
        }

        .folder-item:hover {
            background: #ddd;
        }

        .folder-item.media-folder {
            color: #8b4513;
        }

        #editor-pane {
            flex: 1;
            border-right: 1px solid var(--border-color);
            display: flex;
            flex-direction: column;
        }

        #editor-header {
            padding: 10px;
            background: var(--header-bg);
            border-bottom: 1px solid var(--border-color);
            display: flex;
            flex-direction: column;
        }

        .toolbar-row {
            display: flex;
            justify-content: space-between;
            align-items: center;
            width: 100%;
        }

        .add-block-row {
            display: flex;
            gap: 5px;
            margin-top: 10px;
            overflow-x: auto;
            padding-bottom: 5px;
        }

        .add-block-row button {
            white-space: nowrap;
            font-size: 12px;
        }

        #block-list {
            flex: 1;
            overflow-y: auto;
            padding: 20px;
            background: white;
        }

        .block-edit {
            border: 1px solid #ddd;
            padding: 10px;
            margin-bottom: 15px;
            position: relative;
            background: #fafafa;
            border-radius: 4px;
        }

        .block-edit:hover {
            border-color: #0078d4;
        }

        .block-type-label {
            font-size: 10px;
            color: #888;
            text-transform: uppercase;
            margin-bottom: 5px;
        }

        .block-controls {
            position: absolute;
            top: 5px;
            right: 5px;
            display: none;
        }

        .block-edit:hover .block-controls {
            display: block;
        }

        textarea {
            width: 100%;
            box-sizing: border-box;
            border: 1px solid #ccc;
            padding: 5px;
            font-family: inherit;
            resize: vertical;
        }

        #preview-pane {
            flex: 1;
            display: flex;
            flex-direction: column;
        }

        #preview-header {
            padding: 10px;
            background: var(--header-bg);
            border-bottom: 1px solid var(--border-color);
        }

        #preview-content {
            flex: 1;
            overflow-y: auto;
            padding: 40px;
            background: white;
            line-height: 1.6;
        }

        /* Preview Styles mirroring ArticleViewer */
        .preview-title {
            font-size: 24px;
            font-weight: bold;
            color: #333;
            margin-bottom: 20px;
            text-align: center;
            display: none;
        }

        .preview-header {
            font-size: 20px;
            font-weight: bold;
            color: #444;
            margin-top: 20px;
            margin-bottom: 10px;
            border-bottom: 1px solid #eee;
        }

        .preview-subheader {
            font-size: 16px;
            font-weight: bold;
            color: #555;
            margin-top: 15px;
            margin-bottom: 8px;
        }

        .preview-paragraph {
            margin-bottom: 12px;
            color: #333;
        }

        .preview-image {
            max-width: 100%;
            height: auto;
            display: block;
            margin: 10px auto;
        }

        .preview-video {
            width: 100%;
            aspect-ratio: 16/9;
            background: #000;
            display: flex;
            align-items: center;
            justify-content: center;
            color: white;
            margin: 10px 0;
        }

        .preview-link {
            color: #0078d4;
            text-decoration: underline;
            cursor: pointer;
        }

        /* Modal styles */
        #modal-overlay {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0, 0, 0, 0.5);
            display: none;
            justify-content: center;
            align-items: center;
            z-index: 1000;
        }

        .modal-content {
            background: white;
            padding: 20px;
            border-radius: 5px;
            min-width: 400px;
            max-width: 80%;
            max-height: 80%;
            overflow-y: auto;
            box-shadow: 0 5px 15px rgba(0, 0, 0, 0.3);
        }

        .modal-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            border-bottom: 1px solid #eee;
            margin-bottom: 15px;
            padding-bottom: 10px;
        }

        .modal-footer {
            display: flex;
            justify-content: flex-end;
            gap: 10px;
            margin-top: 20px;
            border-top: 1px solid #eee;
            padding-top: 10px;
        }

        .media-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(100px, 1fr));
            gap: 10px;
            margin-top: 10px;
        }

        .media-item {
            border: 1px solid #ddd;
            padding: 5px;
            text-align: center;
            cursor: pointer;
        }

        .media-item:hover {
            border-color: #0078d4;
            background: #f0f8ff;
        }

        .media-item img {
            max-width: 100%;
            height: 60px;
            object-fit: contain;
        }

        .media-item div {
            font-size: 10px;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
        }

        button {
            cursor: pointer;
            padding: 5px 10px;
            background: #fff;
            border: 1px solid #ccc;
            border-radius: 3px;
        }

        button:hover {
            background: #f0f0f0;
        }

        button.primary {
            background: #0078d4;
            color: white;
            border-color: #005a9e;
        }

        button.primary:hover {
            background: #005a9e;
        }

        button.danger {
            color: #d13438;
        }

        button.danger:hover {
            background: #fde7e9;
        }
    </style>
</head>
<body>
<div id="nav-pane">
    <div id="nav-header">
        <h2>Help Articles</h2>
        <div style="display: flex; gap: 5px;">
            <button onclick="refreshArticleList()">Refresh</button>
            <button class="primary" onclick="createNewArticle()">New</button>
        </div>
    </div>
    <div id="article-list">
        <!-- Loaded via JS -->
    </div>
</div>

<div id="editor-pane">
    <div id="editor-header">
        <div class="toolbar-row">
            <h2 id="current-article-name" style="margin:0">Select an article</h2>
            <div id="editor-actions" style="display: none; display: flex; gap: 5px;">
                <button class="primary" onclick="saveCurrentArticle()">Save</button>
                <button onclick="cancelEdit()">Cancel</button>
                <button onclick="moveArticle()">Move</button>
                <button onclick="consolidateMedia()">Consolidate Media</button>
            </div>
        </div>
        <div id="add-block-toolbar" class="add-block-row" style="display: none;">
            <!-- Buttons added via JS -->
        </div>
    </div>
    <div id="block-list">
        <!-- Loaded via JS -->
        <div style="text-align: center; color: #888; margin-top: 50px;">
            Select an article from the left to start editing.
        </div>
    </div>
</div>

<div id="preview-pane">
    <div id="preview-header">
        <h2>Live Preview</h2>
    </div>
    <div id="preview-content">
        <!-- Rendered via JS -->
    </div>
</div>

<div id="modal-overlay">
    <div class="modal-content" id="modal-content">
        <!-- Content dynamic -->
    </div>
</div>

<script src="/static/web_editor.js"></script>
</body>
</html>
